<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Портфель</title>
  <link rel="stylesheet" href="portfolio.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Портфель</h1>
        <p id="updated" class="lede">Завантаження…</p>
      </div>
      <div class="controls" hidden>
        <button type="button" id="hide-amounts" class="icon-btn" aria-pressed="false" aria-label="Сховати суми">
          <svg class="eye-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-4.1 4.6"/><path d="M6.1 6.1C3.5 7.8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
        <div id="ccy-toggle" class="ccy-toggle" role="group" aria-label="Валюта звіту">
          <button type="button" data-ccy="EUR" class="active">EUR</button>
          <button type="button" data-ccy="USD">USD</button>
        </div>
        <button type="button" id="send-report">Звіт у Telegram</button>
      </div>
    </header>
    <div id="app"></div>
    <footer>Ціни оновлює Home Assistant щогодини. X-Ray і склад портфеля рахуються в браузері під час відкриття сторінки, дані фондів — <a href="https://tickerinside.com/api/" target="_blank" rel="noreferrer">TickerInside</a>.</footer>
  </div>
  <script type="module" src="portfolio.js"></script>
</body>
</html>
