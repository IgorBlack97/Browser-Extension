<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>P2P Auto-Buy Bot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #181A20;
      color: #EAECEF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      padding: 14px 16px;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2B3139;
    }
    .title { font-weight: bold; font-size: 13px; color: #FCD535; }
    .pill {
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: bold;
    }
    .pill-on { background: rgba(14, 203, 129, 0.18); color: #0ECB81; border: 1px solid #0ECB81; }
    .pill-ready { background: rgba(252, 213, 53, 0.15); color: #FCD535; border: 1px solid #FCD535; }
    .pill-off { background: rgba(132, 142, 156, 0.2); color: #848E9C; border: 1px solid #474D57; }

    .master-toggle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1E2329;
      border: 1px solid #2B3139;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .master-toggle.active {
      border-color: #0ECB81;
      background: rgba(14, 203, 129, 0.08);
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    label.lbl { color: #848E9C; font-size: 10px; display: block; margin-bottom: 3px; }
    input[type="number"], input[type="text"], input[type="password"] {
      width: 100%;
      background: #2B3139;
      color: #fff;
      border: 1px solid #474D57;
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #FCD535;
    }
    .section-box {
      background: #1E2329;
      border: 1px solid #2B3139;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 11px;
      font-weight: bold;
      color: #FCD535;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .field-row { margin-bottom: 6px; }
    .field-row:last-child { margin-bottom: 0; }
    .demo-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2B3139;
      padding: 6px 8px;
      border-radius: 5px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn-start { background: #0ECB81; color: #fff; }
    .btn-stop { background: #F6465D; color: #fff; }
    .btn-secondary {
      background: #2B3139;
      color: #EAECEF;
      border: 1px solid #474D57;
      font-size: 11px;
      padding: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🤖 P2P Auto-Buy Bot</div>
    <span id="status-pill" class="pill pill-off">ВИМКНЕНО</span>
  </div>

  <!-- Загальний тогл активації плагіна (показувати чи ховати вікно на сторінці P2P) -->
  <label id="master-toggle-box" class="master-toggle">
    <div>
      <div style="font-weight:bold;font-size:12px;color:#EAECEF;">🔌 Активувати плагін на P2P</div>
      <div style="font-size:10px;color:#848E9C;margin-top:2px;">Показує панель бота на сторінці P2P</div>
    </div>
    <input id="inp-plugin-active" type="checkbox" style="width:18px;height:18px;accent-color:#0ECB81;cursor:pointer;">
  </label>

  <div class="grid">
    <div>
      <label class="lbl">Макс. ціна</label>
      <input id="inp-price" type="number" step="0.01" value="46.70">
    </div>
    <div>
      <label class="lbl">Мін. грн</label>
      <input id="inp-min" type="number" step="50" value="500">
    </div>
    <div>
      <label class="lbl">Макс. грн</label>
      <input id="inp-max" type="number" step="100" value="5000">
    </div>
  </div>

  <label class="demo-box">
    <input id="inp-demo" type="checkbox" style="accent-color:#FCD535;">
    <span style="color:#FCD535;font-weight:bold;">📊 Демо-режим (без покупки)</span>
  </label>

  <div class="section-box">
    <div class="section-title">
      <span>✈️ Налаштування Telegram</span>
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:normal;color:#EAECEF;">
        <input id="inp-tg-enabled" type="checkbox" checked style="accent-color:#0ECB81;"> Увімк.
      </label>
    </div>
    <div class="field-row">
      <label class="lbl">Bot Token (@BotFather)</label>
      <input id="inp-tg-token" type="password" placeholder="123456789:AAH...">
    </div>
    <div class="field-row">
      <label class="lbl">Chat ID (@userinfobot)</label>
      <input id="inp-tg-chat" type="text" placeholder="Ваш Chat ID">
    </div>
  </div>

  <button id="btn-test-tg" class="btn btn-secondary">🔔 Перевірити сповіщення Telegram</button>
  <button id="btn-toggle" class="btn btn-start">▶️ Запустити сканування</button>

  <script src="popup.js"></script>
</body>
</html>
